set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm'

# Change prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Navigate with arrows
bind -r Up select-pane -U
bind -r Down select-pane -D
bind -r Left select-pane -L
bind -r Right select-pane -R
bind q kill-pane

# Previous / next window
bind a previous-window
bind d next-window

# New window
bind w new-window

# Kill current window
bind s kill-window

# Split panes in current dir
bind -r S-Up split-window -v -c "#{pane_current_path}"
bind -r S-Down split-window -v -c "#{pane_current_path}"
bind -r S-Left split-window -h -c "#{pane_current_path}"
bind -r S-Right split-window -h -c "#{pane_current_path}"

# Mouse support
set -g mouse on

# Start window n at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Move with alt+n
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Clipboard
set -g set-clipboard on

# Status bar
# keep the status bar but remove everything except windows
set -g status on
set -g status-left ""
set -g status-right ""

# show only window list
set -g status-justify left

# Format
set -g window-status-current-format " [#I:#W]"
set -g window-status-format " .#I:#W."
set -g status-style bg=default,fg=colour10  # fg=colour10 sets text color (green example)
